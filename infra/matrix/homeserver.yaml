server_name: "scalenix.fr"
public_baseurl: "https://matrix.scalenix.fr/"
pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: "${SYNAPSE_DB_PASSWORD:-changeme}"
    database: synapse
    host: postgres-synapse
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: "/data/log.config"

media_store_path: /data/media_store
uploads_path: /data/uploads

registration_shared_secret: "CHANGE_ME_GENERATE_RANDOM_SECRET"

report_stats: false

macaroon_secret_key: "CHANGE_ME_GENERATE_RANDOM_SECRET"
form_secret: "CHANGE_ME_GENERATE_RANDOM_SECRET"

signing_key_path: "/data/signing.key"

trusted_key_servers:
  - server_name: "matrix.org"

suppress_key_server_warning: true

rc_login:
  address:
    per_second: 100
    burst_count: 100
  account:
    per_second: 100
    burst_count: 100
  failed_attempts:
    per_second: 100
    burst_count: 100
rc_message:
  per_second: 100
  burst_count: 200
rc_joins:
  local:
    per_second: 100
    burst_count: 100
  remote:
    per_second: 100
    burst_count: 100

enable_registration: false
enable_registration_without_verification: false

oidc_providers:
  - idp_id: keycloak
    idp_name: "ScalenixOS"
    issuer: "https://auth.scalenix.fr/realms/scalenix-os"
    client_id: "synapse"
    client_secret: "${SYNAPSE_OIDC_SECRET:-changeme}"
    scopes: ["openid", "profile", "email"]
    skip_verification: true
    user_mapping_provider:
      config:
        localpart_template: "{{ user.preferred_username }}"
        display_name_template: "{{ user.name }}"
        email_template: "{{ user.email }}"
    backchannel_logout_enabled: true
