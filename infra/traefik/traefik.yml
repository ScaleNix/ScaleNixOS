api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: infra_scalenix
  file:
    directory: /etc/traefik/dynamic
    watch: true

# --- Let's Encrypt (OPTIONAL — uncomment for production) ---
