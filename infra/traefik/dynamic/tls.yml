tls:
  certificates:
    - certFile: /certs/wildcard.scalenix.fr.crt
      keyFile: /certs/wildcard.scalenix.fr.key

  stores:
    default:
      defaultCertificate:
        certFile: /certs/wildcard.scalenix.fr.crt
        keyFile: /certs/wildcard.scalenix.fr.key

  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
