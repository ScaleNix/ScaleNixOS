[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
autostart=true
autorestart=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24
autostart=true
autorestart=true
environment=HOME="/home/user"

[program:openbox]
command=/usr/bin/openbox --config-file /home/user/.config/openbox/rc.xml
user=user
autostart=true
autorestart=true
environment=DISPLAY=":1",HOME="/home/user",USER="user"
startsecs=3

[program:libreoffice]
command=/usr/bin/libreoffice --norestore --nologo
user=user
autostart=true
autorestart=true
environment=DISPLAY=":1",HOME="/home/user",USER="user"
startsecs=5
startretries=3

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -listen 127.0.0.1 -xkb -ncache 10 -forever -shared
autostart=true
autorestart=true
startsecs=8

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
autostart=true
autorestart=true
startsecs=10
