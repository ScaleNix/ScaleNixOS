server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Zimbra SOAP API proxy
    location /zimbra-soap/ {
        resolver 127.0.0.11 valid=30s;
        set $zimbra https://zimbradev3.ext.benmekki.com;
        rewrite ^/zimbra-soap/(.*)$ /service/soap/$1 break;
        proxy_pass $zimbra;
        proxy_set_header Host zimbradev3.ext.benmekki.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }

    # Zimbra REST API proxy (for preauth)
    location /zimbra-rest/ {
        resolver 127.0.0.11 valid=30s;
        set $zimbra https://zimbradev3.ext.benmekki.com;
        rewrite ^/zimbra-rest/(.*)$ /service/$1 break;
        proxy_pass $zimbra;
        proxy_set_header Host zimbradev3.ext.benmekki.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }

    # Matrix / Synapse API proxy
    location /matrix-api/ {
        resolver 127.0.0.11 valid=30s;
        set $synapse http://synapse:8008;
        rewrite ^/matrix-api/(.*)$ /_matrix/$1 break;
        proxy_pass $synapse;
        proxy_set_header Host matrix.scalenix.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Nextcloud OCS/Activity API proxy
    location /nextcloud-api/ {
        resolver 127.0.0.11 valid=30s;
        set $nc http://nextcloud;
        rewrite ^/nextcloud-api/(.*)$ /$1 break;
        proxy_pass $nc;
        proxy_set_header Host files.scalenix.fr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header OCS-APIRequest true;
    }

    # Grist API proxy
    location /grist-api/ {
        resolver 127.0.0.11 valid=30s;
        set $grist http://grist:8484;
        rewrite ^/grist-api/(.*)$ /api/$1 break;
        proxy_pass $grist;
        proxy_set_header Host grist.scalenix.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebDAV proxy to Nextcloud (avoids CORS issues)
    location /webdav/ {
        resolver 127.0.0.11 valid=30s;
        set $nc http://nextcloud;
        rewrite ^/webdav/(.*)$ /remote.php/dav/$1 break;
        proxy_pass $nc;
        proxy_set_header Host files.scalenix.fr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body on;
        client_max_body_size 10G;
    }
}
